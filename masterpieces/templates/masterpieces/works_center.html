{% extends 'base.html' %}
{% load static %}

{% block title %}作品中心 - 柚子次元壁{% endblock %}

{% block content %}
<style>
    :root { --theme-color: #ff7675; }
    .works-container { animation: slideUpIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes slideUpIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .zone-selector-wrapper { position: relative; display: flex; justify-content: center; margin-bottom: 30px; }
    .zone-selector {
        position: relative; display: inline-flex; background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px); padding: 5px; border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.8); z-index: 1;
    }
    .active-slider {
        position: absolute; height: calc(100% - 10px); top: 5px; left: 5px;
        background: var(--theme-color); border-radius: 50px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: -1;
        box-shadow: 0 5px 15px rgba(255, 118, 117, 0.3);
    }
    .zone-btn { padding: 12px 35px; border-radius: 50px; color: #666; font-weight: bold; cursor: pointer; transition: color 0.3s; border: none; background: transparent; }
    .zone-btn.active { color: white; }

    .recommend-hero {
        position: relative; height: 180px; border-radius: 24px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 50px; margin-bottom: 40px; overflow: hidden; border: 4px solid white; transition: background 0.6s ease; cursor: pointer;
    }
    .recommend-hero i.fa-star { font-size: 80px; color: rgba(255, 255, 255, 0.4); position: absolute; right: -10px; bottom: -10px; transform: rotate(-15deg); }

    .content-viewport { overflow: hidden; width: 100%; }
    .content-slider { display: flex; width: 300%; transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
    .zone-content-pane { width: 33.3333%; padding: 0 10px; }

    .works-grid { display: grid; grid-template-columns: 1fr 320px; gap: 25px; }
    .work-card {
        background: white; border-radius: 18px; overflow: hidden; transition: all 0.4s ease;
        border: 1px solid rgba(255, 182, 193, 0.2); opacity: 0; transform: translateY(30px);
    }
    .work-card.show { opacity: 1; transform: translateY(0); }
    .work-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

    .rank-list { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid white; }
    .rank-num { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; margin-right: 10px; font-weight: bold; }

    .empty-state { grid-column: span 3; padding: 40px 0; text-align: center; background: rgba(255, 255, 255, 0.4); border-radius: 24px; border: 2px dashed #ffb6c1; margin: 10px 0; }
    .back-home { position: absolute; left: 20px; top: 20px; z-index: 10; opacity: 0; animation: slideInLeft 0.5s ease-out forwards; }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
</style>

<div class="works-container relative">
    <a href="/" class="back-home px-4 py-2 bg-white/90 backdrop-blur rounded-full shadow-sm text-pink-500 hover:bg-pink-500 hover:text-white transition-all acg-font border border-pink-100 flex items-center">
        <i class="fa-solid fa-house-chimney mr-1"></i> 返回首页
    </a>

    <div class="zone-selector-wrapper">
        <div class="zone-selector">
            <div class="active-slider" id="slider-bg"></div>
            <button class="zone-btn active" onclick="switchZone('anime', 0, this)">番剧专区</button>
            <button class="zone-btn" onclick="switchZone('galgame', 1, this)">Galgame专区</button>
            <button class="zone-btn" onclick="switchZone('manga', 2, this)">小说和漫画</button>
        </div>
    </div>

    <div class="recommend-hero" id="recommend-btn" onclick="location.href='{% url 'masterpieces:recommend_work' %}'" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);">
        <div>
            <h2 class="text-3xl font-bold text-white mb-2 acg-font">发现好作？快来安利！</h2>
            <p class="text-white/80">点击进入推荐通道，分享你心中的神作</p>
        </div>
        <div class="bg-white/20 px-8 py-4 rounded-2xl text-white font-bold text-xl border border-white/30 backdrop-blur">
            我要推荐作品 <i class="fa-solid fa-paper-plane ml-2"></i>
        </div>
        <i class="fa-solid fa-star"></i>
    </div>

    <div class="content-viewport">
        <div class="content-slider" id="main-slider">
            <div class="zone-content-pane">
                <div class="works-grid">
                    <div class="space-y-12" id="items-anime"></div>
                    <div class="space-y-6">
                        <h3 class="text-xl font-bold text-gray-700 flex items-center"><span class="w-2 h-6 bg-pink-400 rounded-full mr-3"></span>热度排行</h3>
                        <div class="rank-list" id="rank-anime"></div>
                    </div>
                </div>
            </div>
            <div class="zone-content-pane">
                <div class="works-grid">
                    <div class="space-y-12" id="items-galgame"></div>
                    <div class="space-y-6">
                        <h3 class="text-xl font-bold text-gray-700 flex items-center"><span class="w-2 h-6 bg-blue-400 rounded-full mr-3"></span>热度排行</h3>
                        <div class="rank-list" id="rank-galgame"></div>
                    </div>
                </div>
            </div>
            <div class="zone-content-pane">
                <div class="works-grid">
                    <div class="space-y-12" id="items-manga"></div>
                    <div class="space-y-6">
                        <h3 class="text-xl font-bold text-gray-700 flex items-center"><span class="w-2 h-6 bg-green-400 rounded-full mr-3"></span>热度排行</h3>
                        <div class="rank-list" id="rank-manga"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const zoneConfigs = {
        anime: { theme: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)", color: "#ff7675", accent: "bg-pink-400" },
        galgame: { theme: "linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)", color: "#74b9ff", accent: "bg-blue-400" },
        manga: { theme: "linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)", color: "#55efc4", accent: "bg-green-400" }
    };

    // works_center.html 里的 JavaScript 部分

function generateGridHtml(items) {
    if (!items || items.length === 0) return `<div class="empty-state"><p class="text-gray-400 text-sm italic">该栏目暂无作品~</p></div>`;

    return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${items.map(item => `
            <a href="${item.url}" class="work-card shadow-sm block hover:no-underline">
                <div class="relative group">
                    <img src="${item.img}" class="w-full h-48 object-cover">
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <span class="px-3 py-1 bg-white/90 rounded-full text-pink-500 text-xs font-bold">查看详情</span>
                    </div>
                </div>
                <div class="p-4">
                    <span class="px-2 py-0.5 bg-pink-50 text-pink-400 text-[10px] font-bold rounded uppercase">${item.tag}</span>
                    <h4 class="font-bold text-gray-800 mt-2 truncate">${item.title}</h4>
                    <div class="flex justify-between items-center mt-3">
                        <div class="flex items-center">
                            ${parseFloat(item.hot) > 0 ? `
                                <i class="fa-solid fa-star text-yellow-500 text-[10px] mr-1"></i>
                                <span class="text-sm font-mono font-bold text-yellow-500">${item.hot}</span>
                            ` : `
                                <span class="text-xs text-gray-400 italic">暂无评分</span>
                            `}
                        </div>
                        <i class="fa-solid fa-heart text-gray-200 hover:text-pink-500 cursor-pointer transition-colors"></i>
                    </div>
                </div>
            </a>
        `).join('')}
    </div>`;
}

    function renderSection(zone, data, ranks) {
        const mainContainer = document.getElementById(`items-${zone}`);
        const rankContainer = document.getElementById(`rank-${zone}`);
        const accentClass = zoneConfigs[zone].accent;

        // 1. 渲染主内容区 (为你推荐/热门/最新)
        mainContainer.innerHTML = `
            <div class="sub-section"><h3 class="text-xl font-bold text-gray-700 flex items-center mb-6"><span class="w-2 h-6 ${accentClass} rounded-full mr-3"></span>为你推荐</h3>${generateGridHtml(data.recommend)}</div>
            <div class="sub-section"><h3 class="text-xl font-bold text-gray-700 flex items-center mb-6"><span class="w-2 h-6 ${accentClass} rounded-full mr-3"></span>热门作品</h3>${generateGridHtml(data.hot)}</div>
            <div class="sub-section"><h3 class="text-xl font-bold text-gray-700 flex items-center mb-6"><span class="w-2 h-6 ${accentClass} rounded-full mr-3"></span>最新发布</h3>${generateGridHtml(data.latest)}</div>
        `;

        // 2. 渲染排行榜区 (新增空状态判断)
        if (rankContainer) {
            if (!ranks || ranks.length === 0) {
                // 如果排行榜没有数据，显示提示文本
                rankContainer.innerHTML = `
                    <div class="py-10 text-center">
                        <i class="fa-solid fa-layer-group text-gray-200 text-3xl mb-2"></i>
                        <p class="text-gray-400 text-sm italic">目前排行榜还没有作品哦~</p>
                    </div>`;
            } else {
                // 如果有数据，则正常渲染列表
                rankContainer.innerHTML = ranks.map((name, i) => `
                    <div class="flex items-center justify-between py-3 border-b border-pink-50/50 last:border-0 hover:bg-white/40 px-2 rounded-lg transition-colors">
                        <div class="flex items-center overflow-hidden">
                            <span class="rank-num ${i < 3 ? 'bg-gradient-to-br from-pink-400 to-red-400 text-white' : 'bg-gray-100 text-gray-400'}">${i+1}</span>
                            <span class="text-sm font-medium text-gray-700 truncate">${name}</span>
                        </div>
                        <div class="flex items-center ml-2">
                            <i class="fa-solid fa-fire text-[10px] text-orange-400 mr-1 animate-pulse"></i>
                            <span class="text-xs text-orange-400 font-mono font-bold">${(99.9 - i * 4.2).toFixed(1)}w</span>
                        </div>
                    </div>`).join('');
            }
        }

        // 动画延迟显示
        setTimeout(() => {
            mainContainer.querySelectorAll('.work-card').forEach((card, i) => {
                setTimeout(() => card.classList.add('show'), i * 50);
            });
        }, 100);
    }

    function switchZone(zone, index, btnElement) {
        const sliderBg = document.getElementById('slider-bg');
        sliderBg.style.width = btnElement.offsetWidth + 'px';
        sliderBg.style.transform = `translateX(${btnElement.offsetLeft - 5}px)`;
        sliderBg.style.background = zoneConfigs[zone].color;
        document.querySelectorAll('.zone-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('main-slider').style.transform = `translateX(-${index * 33.3333}%)`;
        document.getElementById('recommend-btn').style.background = zoneConfigs[zone].theme;
    }

    document.addEventListener('DOMContentLoaded', () => {
    // 1. 渲染番剧专区
    renderSection('anime', {
        recommend: [
            {% for item in anime_list %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",  // ✅ 正确的写法：在服务器端生成完整URL
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/a{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ],
        hot: [
            {% for item in anime_hot %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/ah{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ],
        latest: [
            {% for item in anime_list %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/al{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ]
    }, [{% for r in anime_ranks %}"{{ r.title|escapejs }}",{% endfor %}]);

    // 2. 渲染 Galgame 专区
    renderSection('galgame', {
        recommend: [
            {% for item in galgame_list %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/g{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ],
        hot: [
            {% for item in galgame_hot %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/gh{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ],
        latest: [
            {% for item in galgame_list %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/gl{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ]
    }, [{% for r in galgame_ranks %}"{{ r.title|escapejs }}",{% endfor %}]);

    // 3. 渲染 小说/漫画 专区
    renderSection('manga', {
        recommend: [
            {% for item in manga_list %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/m{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ],
        hot: [
            {% for item in manga_hot %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/mh{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ],
        latest: [
            {% for item in manga_list %}{
                id: "{{ item.id }}",
                url: "{% url 'masterpieces:work_detail' item.id %}",
                title: "{{ item.title|escapejs }}",
                tag: "{% for t in item.tags.all|slice:':3' %}{{ t.name }}{% if not forloop.last %}/{% endif %}{% endfor %}",
                hot: "{{ item.hot_score|default:'0' }}",
                img: "{% if item.cover %}{{ item.cover.url }}{% else %}https://picsum.photos/seed/ml{{item.id}}/300/400{% endif %}"
            },{% endfor %}
        ]
    }, [{% for r in manga_ranks %}"{{ r.title|escapejs }}",{% endfor %}]);

    // 初始化显示第一页
    switchZone('anime', 0, document.querySelector('.zone-btn'));
});
</script>
{% endblock %}
