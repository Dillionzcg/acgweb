{% extends 'base.html' %}
{% load static %}

{% block title %}作品中心 - 柚子次元壁{% endblock %}

{% block content %}
<style>
    :root { --theme-color: #ff7675; }
    .works-container { animation: slideUpIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    @keyframes slideUpIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

    .zone-selector-wrapper { position: relative; display: flex; justify-content: center; margin-bottom: 30px; }
    .zone-selector {
        position: relative; display: inline-flex; background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px); padding: 5px; border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.8); z-index: 1;
    }
    .active-slider {
        position: absolute; height: calc(100% - 10px); top: 5px; left: 5px;
        background: var(--theme-color); border-radius: 50px;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: -1;
        box-shadow: 0 5px 15px rgba(255, 118, 117, 0.3);
    }
    .zone-btn { padding: 12px 35px; border-radius: 50px; color: #666; font-weight: bold; cursor: pointer; transition: color 0.3s; border: none; background: transparent; }
    .zone-btn.active { color: white; }

    .recommend-hero {
        position: relative; height: 180px; border-radius: 24px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 50px; margin-bottom: 40px; overflow: hidden; border: 4px solid white; transition: background 0.6s ease; cursor: pointer;
    }
    .recommend-hero i.fa-star { font-size: 80px; color: rgba(255, 255, 255, 0.4); position: absolute; right: -10px; bottom: -10px; transform: rotate(-15deg); }

    .content-viewport { overflow: hidden; width: 100%; }
    .content-slider { display: flex; width: 300%; transition: transform 0.6s cubic-bezier(0.65, 0, 0.35, 1); }
    .zone-content-pane { width: 33.3333%; padding: 0 10px; }

    .works-grid { display: grid; grid-template-columns: 1fr 320px; gap: 25px; }
    .work-card {
        background: white; border-radius: 18px; overflow: hidden; transition: all 0.4s ease;
        border: 1px solid rgba(255, 182, 193, 0.2); opacity: 0; transform: translateY(30px);
    }
    .work-card.show { opacity: 1; transform: translateY(0); }
    .work-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }

    .rank-list { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid white; }
    .rank-num { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; margin-right: 10px; font-weight: bold; }
    /* 标题文字渐变与立体感 */
.title-gradient {
    background: linear-gradient(to bottom, #ff7675 0%, #d63031 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    /* 增加一层极细的白色描边，让文字在粉色背景下更清晰 */
    filter: drop-shadow(0 4px 6px rgba(255, 118, 117, 0.2));
}

/* 悬停时的发光效果 */
.title-main-group:hover .title-gradient {
    filter: drop-shadow(0 0 12px rgba(255, 118, 117, 0.5));
    transition: all 0.4s ease;
}

/* 针对不同分区的色彩联动（可选） */
/* 当切换到 Galgame 蓝色专区时，如果你想让标题也变色，可以在 switchZone 函数里动态修改这个 class */
.title-gradient.blue-theme {
    background: linear-gradient(to bottom, #74b9ff 0%, #0984e3 100%);
    filter: drop-shadow(0 4px 6px rgba(116, 185, 255, 0.2));
}
    .empty-state { grid-column: span 3; padding: 40px 0; text-align: center; background: rgba(255, 255, 255, 0.4); border-radius: 24px; border: 2px dashed #ffb6c1; margin: 10px 0; }
    .back-home { position: absolute; left: 20px; top: 20px; z-index: 10; opacity: 0; animation: slideInLeft 0.5s ease-out forwards; }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
</style>

        anime: { theme: "linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)", color: "#ff7675", accent: "bg-pink-400" },
        galgame: { theme: "linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%)", color: "#74b9ff", accent: "bg-blue-400" },
        manga: { theme: "linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)", color: "#55efc4", accent: "bg-green-400" }

    // works_center.html 里的 JavaScript 部分

// works_center.html 脚本部分

function generateGridHtml(items) {
    if (!items || items.length === 0) return `<div class="empty-state"><p class="text-gray-400 text-sm italic">该栏目暂无作品~</p></div>`;

    return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${items.map(item => `
            <div class="work-card shadow-sm block relative">
                <a href="${item.url}" class="hover:no-underline">
                    <div class="relative group">
                        <img src="${item.img}" class="w-full h-48 object-cover">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="px-3 py-1 bg-white/90 rounded-full text-pink-500 text-xs font-bold">查看详情</span>
                        </div>
                    </div>
                </a>
                <div class="p-4">
                    <span class="px-2 py-0.5 bg-pink-50 text-pink-400 text-[10px] font-bold rounded uppercase">${item.tag}</span>
                    <h4 class="font-bold text-gray-800 mt-2 truncate">${item.title}</h4>
                <div class="flex justify-between items-center mt-3">
                    <div class="flex items-center">
                        ${parseFloat(item.hot) > 0 ? `<i class="fa-solid fa-star text-yellow-500 text-[10px] mr-1"></i><span class="text-sm font-mono font-bold text-yellow-500">${item.hot}</span>` : `<span class="text-xs text-gray-400 italic">暂无评分</span>`}
                    </div>
                    <i class="fa-heart cursor-pointer transition-all duration-300 ${item.is_fav ? 'fa-solid text-pink-500 scale-125' : 'fa-regular text-gray-300 hover:text-pink-400'}"
                       onclick="toggleFavorite(this, ${item.id})"></i>
                </div>
                </div>
            </div>
        `).join('')}
    </div>`;
}

    function renderSection(zone, data, ranks) {
        const mainContainer = document.getElementById(`items-${zone}`);
        const rankContainer = document.getElementById(`rank-${zone}`);
        const accentClass = zoneConfigs[zone].accent;

        // 1. 处理“为你推荐”部分的 HTML
    let recommendContent = '';
    if (data.recommend && data.recommend.length > 0) {
        recommendContent = generateGridHtml(data.recommend);
    } else {
        // 无重合标签或未设置喜好时的空状态
        recommendContent = `
            <div class="empty-state border-pink-200 bg-pink-50/50 flex flex-col items-center justify-center py-10">
                <p class="text-gray-400 text-sm italic mb-4">暂无符合你口味的作品推介~</p>
                <a href="http://127.0.0.1:8000/user_center/" class="px-6 py-2 bg-white border border-pink-400 text-pink-500 rounded-full hover:bg-pink-500 hover:text-white transition-all text-sm font-bold shadow-sm">
                    <i class="fa-solid fa-tags mr-2"></i> 编辑我的爱好
                </a>
            </div>`;
    }

    // 2. 渲染主内容区
    mainContainer.innerHTML = `
        <div class="sub-section">
            <h3 class="text-xl font-bold text-gray-700 flex items-center mb-6">
                <span class="w-2 h-6 ${accentClass} rounded-full mr-3"></span>为你推荐
            </h3>
            ${recommendContent}
        </div>
        <div class="sub-section mt-10">
            <h3 class="text-xl font-bold text-gray-700 flex items-center mb-6">
                <span class="w-2 h-6 ${accentClass} rounded-full mr-3"></span>热门作品
            </h3>
            ${generateGridHtml(data.hot)}
        </div>
        <div class="sub-section mt-10">
            <h3 class="text-xl font-bold text-gray-700 flex items-center mb-6">
                <span class="w-2 h-6 ${accentClass} rounded-full mr-3"></span>最新发布
            </h3>
            ${generateGridHtml(data.latest)}
        </div>
    `;


        // 2. 渲染排行榜区
    if (rankContainer) {
        if (!ranks || ranks.length === 0) {
            rankContainer.innerHTML = `
                <div class="py-10 text-center">
                    <i class="fa-solid fa-layer-group text-gray-200 text-3xl mb-2"></i>
                    <p class="text-gray-400 text-sm italic">目前排行榜还没有作品哦~</p>
                </div>`;
        } else {
            // 修改点：1. 增加 <a> 标签跳转； 2. 去掉右侧热度数值显示； 3. 增加链接
            rankContainer.innerHTML = ranks.map((item, i) => `
                <a href="${item.url}" class="flex items-center justify-between py-3 border-b border-pink-50/50 last:border-0 hover:bg-white/60 px-2 rounded-lg transition-all group no-underline">
                    <div class="flex items-center overflow-hidden">
                        <span class="rank-num ${i < 3 ? 'bg-gradient-to-br from-pink-400 to-red-400 text-white' : 'bg-gray-100 text-gray-400'}">${i+1}</span>
                        <span class="text-sm font-medium text-gray-700 truncate group-hover:text-pink-500 transition-colors">${item.title}</span>
                    </div>
                    <div class="flex items-center ml-2">
                        <i class="fa-solid fa-chevron-right text-[10px] text-gray-300 group-hover:text-pink-300"></i>
                    </div>
                </a>`).join('');
        }
    }

        // 动画延迟显示
        setTimeout(() => {
            mainContainer.querySelectorAll('.work-card').forEach((card, i) => {
                setTimeout(() => card.classList.add('show'), i * 50);
            });
        }, 100);
    }

    function switchZone(zone, index, btnElement,isInit = false) {
        localStorage.setItem('last_active_zone', JSON.stringify({ zone, index }));
        const slider = document.getElementById('main-slider');
    const sliderBg = document.getElementById('slider-bg');

    // 如果是初始化，暂时关闭过渡效果
    if (isInit) {
        slider.style.transition = 'none';
        sliderBg.style.transition = 'none';
    }
        sliderBg.style.width = btnElement.offsetWidth + 'px';
        sliderBg.style.transform = `translateX(${btnElement.offsetLeft - 5}px)`;
        sliderBg.style.background = zoneConfigs[zone].color;
        document.querySelectorAll('.zone-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById('main-slider').style.transform = `translateX(-${index * 33.3333}%)`;
        document.getElementById('recommend-btn').style.background = zoneConfigs[zone].theme;
        if (isInit) {
        slider.offsetHeight; // 触发 reflow
        slider.style.transition = 'transform 0.6s cubic-bezier(0.65, 0, 0.35, 1)';
        sliderBg.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
    }
    }

document.addEventListener('DOMContentLoaded', function() {
    const workName = localStorage.getItem('just_recommended_work');

    if (workName) {

            askXiaoYou('USER_ACTION', `我刚刚在作品中心安利了作品《${workName}》`);
        }
        localStorage.removeItem('just_recommended_work'); // 用完删掉，防止刷新后重复触发
    } else {
        // 正常的进入逻辑
        if (typeof askXiaoYou === 'function') {
            askXiaoYou('CENTER_ENTER', '作品中心');
        }
    }
});
async function toggleFavorite(el, workId) {
    // 1. 检查登录状态
    {% if not user.is_authenticated %}
        alert("请先登录后再收藏哦~");
        return;
    {% endif %}

    try {
        const response = await fetch(`/works/work/${workId}/favorite/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            }
        });

        if (!response.ok) throw new Error('网络请求失败');

        const data = await response.json();
        const cardTitle = el.closest('.work-card').querySelector('h4').innerText; // 获取作品标题

        // 2. 创建浮动文字提示
        const tip = document.createElement('span');
        tip.className = 'absolute -top-8 left-1/2 -translate-x-1/2 text-xs font-bold py-1 px-2 rounded-full transition-all duration-500 pointer-events-none opacity-0';

        if (data.is_favorite) {
            // 变为已收藏状态
            el.classList.remove('fa-regular', 'text-gray-300');
            el.classList.add('fa-solid', 'text-pink-500', 'scale-125');

            tip.innerText = '已收藏';
            tip.classList.add('bg-pink-500', 'text-white');

            // --- 联动看板娘小柚 ---
            if (typeof askXiaoYou === 'function') {
                askXiaoYou('USER_ACTION', `我刚刚收藏了作品《${cardTitle}》`);
            }
        } else {
            // 变为未收藏状态
            el.classList.remove('fa-solid', 'text-pink-500');
            el.classList.add('fa-regular', 'text-gray-300');

            tip.innerText = '已取消';
            tip.classList.add('bg-gray-500', 'text-white');
        }

        // 3. 插入提示并执行动画
        el.parentElement.style.position = 'relative'; // 确保父容器是相对定位
        el.parentElement.appendChild(tip);

        // 触发动画
        requestAnimationFrame(() => {
            tip.style.opacity = '1';
            tip.style.transform = 'translate(-50%, -10px)';
        });

        // 4. 移除提示并恢复图标缩放
        setTimeout(() => {
            el.classList.remove('scale-125');
            tip.style.opacity = '0';
            setTimeout(() => tip.remove(), 500);
        }, 800);

    } catch (error) {
        console.error("收藏失败:", error);
        if (typeof askXiaoYou === 'function') {
            askXiaoYou('GENERAL', "小柚，刚才收藏操作好像出错了，呜呜...");
        }
    }
}
</script>
