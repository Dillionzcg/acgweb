<div class="illust-card group relative mb-6 break-inside-avoid">
    <div class="relative overflow-hidden rounded-2xl bg-gray-100 border border-white/50 shadow-sm transition-all duration-500 hover:shadow-purple-200 hover:shadow-xl hover:-translate-y-1">
        <a href="{% url 'masterpieces:illustration_detail' item.id %}">
            <img src="{{ item.image.url }}" alt="{{ item.title }}"
                 class="w-full h-auto object-cover transition duration-700 group-hover:scale-105">
        </a>

        <div class="absolute top-3 left-3 opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="px-3 py-1 bg-white/90 backdrop-blur-md rounded-full text-[10px] font-bold text-purple-600 shadow-sm">
                {% if item.work_type == 'original' %}✨ 原创{% else %}📦 搬运{% endif %}
            </span>
        </div>

        <div class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black/60 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
            <h4 class="text-white font-bold text-sm truncate mb-1">{{ item.title }}</h4>
            <div class="flex items-center gap-2">
                <div class="w-5 h-5 rounded-full bg-purple-200 flex items-center justify-center text-[10px] text-purple-700 font-bold">
                    {{ item.owner.username|first|upper }}
                </div>
                <span class="text-white/80 text-xs truncate">@{{ item.owner.username }}</span>
            </div>
        </div>
    </div>

    <div class="mt-2 flex flex-wrap gap-1 px-1">
        {% for tag in item.tags.all|slice:":3" %}
            <span class="text-[10px] text-purple-400 bg-purple-50 px-2 py-0.5 rounded-md italic">#{{ tag.name }}</span>
        {% endfor %}
    </div>
</div>
